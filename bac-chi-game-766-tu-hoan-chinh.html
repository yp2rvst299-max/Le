function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function beep(ok){if(muted)return;audio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=ok?740:190;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.09,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+(ok?.22:.32));o.start();o.stop(audioCtx.currentTime+(ok?.24:.34));}
function start(){audio();let l=$('lesson').value;pool=VOCAB.filter(x=>l==='all'||lessonOf(x[0])==+l);pool=shuffle(pool);let c=$('count').value==='all'?pool.length:+$('count').value;quiz=pool.slice(0,Math.min(c,pool.length));idx=0;score=0;locked=false;$('setup').classList.add('hidden');$('finish').classList.add('hidden');$('game').classList.remove('hidden');show()}
function makeOptions(correct,field){let candidates=shuffle(VOCAB.filter(x=>x[0]!==correct[0]).map(x=>x[field])).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);return shuffle([correct[field],...candidates])}
function show(){locked=false;const w=quiz[idx], mode=$('mode').value==='mixed'?['zhvi','vizh','zhpy'][Math.floor(Math.random()*3)]:$('mode').value;w._mode=mode;$('counter').textContent=`Câu ${idx+1}/${quiz.length} • #${w[0]}`;$('score').textContent=`⭐ ${score}`;$('bar').style.width=((idx/quiz.length)*100)+'%';$('feedback').textContent='';$('answers').innerHTML='';$('hint').textContent='';if(mode==='zhvi'){$('promptLabel').textContent='Chọn nghĩa tiếng Việt';$('prompt').textContent=w[1];$('sub').textContent=w[2];let opts=makeOptions(w,3);opts.forEach(v=>add(v,v===w[3]))}else if(mode==='vizh'){$('promptLabel').textContent='Chọn chữ Phồn thể';$('prompt').textContent=w[3];$('sub').textContent='Nghĩa tiếng Việt';let opts=makeOptions(w,1);opts.forEach(v=>add(v,v===w[1]))}else{$('promptLabel').textContent='Chọn Pinyin';$('prompt').textContent=w[1];$('sub').textContent='Phát âm nào đúng?';let opts=makeOptions(w,2);opts.forEach(v=>add(v,v===w[2]))}}
function add(text,isCorrect){const b=document.createElement('button');b.className='answer';b.textContent=text;b.onclick=()=>answer(b,isCorrect);$('answers').appendChild(b)}
function answer(btn,ok){if(locked)return;if(ok){locked=true;btn.classList.add('correct');score++;$('score').textContent=`⭐ ${score}`;$('feedback').textContent='✨ Chính xác!';beep(true);setTimeout(()=>{idx++;if(idx>=quiz.length)finish();else show()},420)}else{btn.classList.add('wrong');$('feedback').textContent='💭 Chưa đúng, thử lại nhé!';beep(false);setTimeout(()=>btn.classList.remove('wrong'),500)}}
function finish(){$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('finalScore').textContent=`${score} / ${quiz.length} ⭐`;$('finalText').textContent=score===quiz.length?'Quá đỉnh! Mày đúng hết rồi 🔥':`Đúng ${Math.round(score/quiz.length*100)}%. Cứ chơi lại để nhớ lâu hơn nhé!`;$('review').innerHTML=quiz.map((w,i)=>`<div><b>#${w[0]} ${w[1]}</b> · ${w[2]}<br><span class="small">${w[3]}</span></div>`).join('')}
$('start').onclick=start;$('again').onclick=()=>{$('finish').classList.add('hidden');$('setup').classList.remove('hidden')};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 Tắt âm':'🔊 Âm thanh';if(!muted)audio()};
</script></body></html>
