<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🇹🇼 BẮC CHI GAME - 766 TỪ PHỒN THỂ</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#ffe4f1,#dff5ff,#fff3c4);
  color:#333;
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    radial-gradient(circle at 10% 20%,#ff69b4 0 4px,transparent 5px),
    radial-gradient(circle at 80% 30%,#4db8ff 0 5px,transparent 6px),
    radial-gradient(circle at 30% 80%,#ffd43b 0 4px,transparent 5px),
    radial-gradient(circle at 90% 85%,#8ce99a 0 5px,transparent 6px);
}

.container{
  width:min(680px,94%);
  margin:0 auto;
  padding:18px 0 40px;
}

header{
  text-align:center;
  padding:18px 10px 10px;
}

.logo{
  font-size:42px;
  animation:bounce 1.8s infinite;
}

h1{
  margin:5px 0;
  font-size:28px;
  color:#6f42c1;
  text-shadow:2px 2px 0 white;
}

.subtitle{
  color:#555;
  font-size:14px;
}

@keyframes bounce{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-8px) rotate(3deg)}
}

.card{
  background:rgba(255,255,255,.92);
  border:3px solid white;
  border-radius:28px;
  padding:20px;
  box-shadow:0 12px 35px rgba(80,60,120,.15);
  margin-top:15px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.badge{
  background:#f3d9ff;
  color:#7b2cbf;
  padding:8px 13px;
  border-radius:20px;
  font-weight:700;
  font-size:13px;
}

button{
  border:0;
  border-radius:16px;
  padding:12px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

button:active{
  transform:scale(.94);
}

.sound{
  background:#fff0a8;
}

.select-box{
  width:100%;
  margin-top:15px;
  padding:13px;
  border-radius:15px;
  border:2px solid #ddd;
  font-size:16px;
  background:white;
}

.progress{
  height:12px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin:18px 0;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff6b9a,#845ef7,#339af0);
  transition:.3s;
}

.question-number{
  text-align:center;
  color:#777;
  font-weight:700;
}

.word{
  text-align:center;
  margin:18px 0;
}

.chinese{
  font-size:54px;
  font-weight:900;
  color:#5f3dc4;
  line-height:1.2;
}

.pinyin{
  font-size:21px;
  color:#e8590c;
  margin-top:8px;
  font-weight:700;
}

.meaning{
  font-size:17px;
  color:#555;
  margin-top:5px;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:20px;
}

.answer{
  min-height:65px;
  background:#f8f9fa;
  border:3px solid #e9ecef;
  color:#333;
}

.answer:hover{
  background:#e7f5ff;
  border-color:#74c0fc;
}

.answer.correct{
  background:#d3f9d8;
  border-color:#40c057;
  color:#176b2c;
}

.answer.wrong{
  background:#ffe3e3;
  border-color:#fa5252;
  color:#a61e1e;
}

.feedback{
  min-height:32px;
  text-align:center;
  margin-top:15px;
  font-size:18px;
  font-weight:800;
}

.score{
  text-align:center;
  font-size:18px;
  font-weight:800;
  margin-top:8px;
}

.start{
  display:block;
  margin:15px auto 0;
  background:linear-gradient(135deg,#845ef7,#e64980);
  color:white;
  font-size:18px;
  padding:15px 30px;
}

.hidden{
  display:none!important;
}

.result{
  text-align:center;
}

.result .emoji{
  font-size:75px;
}

.result h2{
  color:#7b2cbf;
  font-size:30px;
}

.result-score{
  font-size:25px;
  font-weight:900;
  color:#e64980;
}

.small{
  font-size:13px;
  color:#777;
  text-align:center;
  margin-top:15px;
}

@media(max-width:480px){
  .chinese{font-size:46px}
  .answers{grid-template-columns:1fr}
  h1{font-size:24px}
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">🇹🇼🎮✨</div>
  <h1>BẮC CHI GAME</h1>
  <div class="subtitle">766 TỪ VỰNG TIẾNG TRUNG PHỒN THỂ</div>
</header>

<div class="card">

  <div class="topbar">
    <div class="badge">📚 Học từ vựng</div>
    <button class="sound" id="soundBtn" onclick="toggleSound()">🔊 Âm thanh</button>
  </div>

  <select id="lesson" class="select-box">
    <option value="all">🎲 Tất cả từ vựng</option>
    <option value="1">📖 Bài 1</option>
    <option value="2">📖 Bài 2</option>
    <option value="3">📖 Bài 3</option>
    <option value="4">📖 Bài 4</option>
    <option value="5">📖 Bài 5</option>
    <option value="6">📖 Bài 6</option>
    <option value="7">📖 Bài 7</option>
    <option value="8">📖 Bài 8</option>
    <option value="9">📖 Bài 9</option>
    <option value="10">📖 Bài 10</option>
    <option value="11">📖 Bài 11</option>
    <option value="12">📖 Bài 12</option>
    <option value="13">📖 Bài 13</option>
    <option value="14">📖 Bài 14</option>
    <option value="15">📖 Bài 15</option>
  </select>

  <button class="start" id="startBtn" onclick="startGame()">
    🚀 BẮT ĐẦU CHƠI
  </button>

  <div id="game" class="hidden">

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="questionNumber" class="question-number"></div>

    <div class="word">
      <div id="chinese" class="chinese"></div>
      <div id="pinyin" class="pinyin"></div>
      <div id="meaning" class="meaning"></div>
    </div>

    <div id="answers" class="answers"></div>

    <div id="feedback" class="feedback"></div>

    <div id="score" class="score">
      ⭐ Điểm: 0
    </div>

  </div>

  <div id="result" class="result hidden">
    <div class="emoji">🎉🏆🎊</div>
    <h2>HOÀN THÀNH!</h2>
    <div class="result-score" id="finalScore"></div>
    <p id="finalMessage"></p>

    <button class="start" onclick="startGame()">
      🔄 CHƠI LẠI
    </button>
  </div>

  <div class="small">
    💡 Đúng → âm thanh vui + tự sang câu tiếp theo<br>
    😅 Sai → âm thanh hơi buồn + vẫn ở câu hiện tại
  </div>

</div>

</div>

/* =========================================================
   ÂM THANH
   ========================================================= */

let soundOn = true;
let audioCtx = null;

function audioStart(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}

function tone(freq,duration,type="sine",volume=.08,delay=0){
  if(!soundOn) return;
  audioStart();

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(0.0001,audioCtx.currentTime+delay);
  gain.gain.exponentialRampToValueAtTime(
    volume,
    audioCtx.currentTime+delay+.02
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioCtx.currentTime+delay+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(audioCtx.currentTime+delay);
  osc.stop(audioCtx.currentTime+delay+duration+.03);
}

function happySound(){
  tone(523.25,.12,"sine",.08,0);
  tone(659.25,.12,"sine",.08,.09);
  tone(783.99,.2,"sine",.1,.18);
}

function wrongSound(){
  tone(220,.18,"triangle",.06,0);
  tone(185,.25,"triangle",.05,.15);
}

function finishSound(){
  tone(523,.12,"sine",.08,0);
  tone(659,.12,"sine",.08,.12);
  tone(784,.12,"sine",.08,.24);
  tone(1047,.3,"sine",.1,.36);
}

function toggleSound(){
  soundOn=!soundOn;
  document.getElementById("soundBtn").textContent =
    soundOn ? "🔊 Âm thanh" : "🔇 Tắt âm";
}

/* =========================================================
   GAME
   ========================================================= */

let pool=[];
let current=0;
let score=0;
let answered=false;

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

function startGame(){

  audioStart();

  const lesson=document.getElementById("lesson").value;

  pool = lesson==="all"
    ? shuffle(VOCAB)
    : shuffle(VOCAB.filter(x=>String(x[3])===lesson));

  /*
    Mỗi lần chơi lấy tối đa 20 câu.
    Có thể đổi thành pool.length nếu muốn chơi toàn bộ.
  */
  pool=pool.slice(0,20);

  current=0;
  score=0;
  answered=false;

  document.getElementById("startBtn").classList.add("hidden");
  document.getElementById("lesson").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  showQuestion();
}

function showQuestion(){

  if(current>=pool.length){
    finishGame();
    return;
  }

  answered=false;

  const item=pool[current];

  document.getElementById("questionNumber").textContent =
    `Câu ${current+1} / ${pool.length}`;

  document.getElementById("chinese").textContent=item[0];
  document.getElementById("pinyin").textContent=item[1];
  document.getElementById("meaning").textContent="";

  document.getElementById("feedback").textContent="";

  document.getElementById("score").textContent=
    `⭐ Điểm: ${score}`;

  document.getElementById("progressBar").style.width=
    `${(current/pool.length)*100}%`;

  createAnswers(item);
}

function createAnswers(correct){

  const answers=document.getElementById("answers");
  answers.innerHTML="";

  let choices=[correct];

  const others=shuffle(
    VOCAB.filter(x=>x[0]!==correct[0])
  ).slice(0,3);

  choices=shuffle([...choices,...others]);

  choices.forEach(item=>{

    const btn=document.createElement("button");

    btn.className="answer";
    btn.textContent=item[2];

    btn.onclick=()=>checkAnswer(btn,item,correct);

    answers.appendChild(btn);
  });
}

function checkAnswer(btn,item,correct){

  if(answered) return;

  if(item[0]===correct[0]){

    answered=true;

    btn.classList.add("correct");

    score++;

    document.getElementById("feedback").textContent=
      "🎉 Chính xác! Tuyệt vời!";

    document.getElementById("meaning").textContent=
      correct[2];

    document.getElementById("score").textContent=
      `⭐ Điểm: ${score}`;

    happySound();

    setTimeout(()=>{
      current++;
      showQuestion();
    },650);

  }else{

    btn.classList.add("wrong");

    document.getElementById("feedback").textContent=
      "😅 Chưa đúng! Thử lại nhé!";

    wrongSound();

    /*
      Không chuyển câu.
      Người chơi phải chọn lại.
    */
    setTimeout(()=>{
      btn.classList.remove("wrong");
      document.getElementById("feedback").textContent="";
    },700);
  }
}

function finishGame(){

  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("progressBar").style.width="100%";

  const percent=Math.round(score/pool.length*100);

  document.getElementById("finalScore").textContent=
    `${score} / ${pool.length} điểm — ${percent}%`;

  let message="";

  if(percent===100){
    message="🏆 ĐỈNH QUÁ! Mày làm đúng hết luôn!";
  }else if(percent>=80){
    message="🎉 Quá giỏi! Tiếp tục phát huy nhé!";
  }else if(percent>=60){
    message="😎 Khá tốt! Ôn thêm một chút là lên điểm cao!";
  }else{
    message="💪 Không sao! Chơi lại vài lần sẽ nhớ từ hơn!";
  }

  document.getElementById("finalMessage").textContent=message;

  finishSound();
}

/* =========================================================
   KHỞI TẠO
   ========================================================= */

document.getElementById("lesson").addEventListener("change",()=>{
  document.getElementById("startBtn").classList.remove("hidden");
});

</script>
